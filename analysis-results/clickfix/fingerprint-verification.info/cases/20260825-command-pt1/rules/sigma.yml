title: ClickFix captured command pt1
id: 32cefba9-9400-d17d-3cb7-dbd0c0a505d2
status: experimental
description: clickfix-command.txtで確認したPowerShell command lineの特徴を検知する。
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\powershell.exe'
  selection_commandline:
    CommandLine|contains|all:
      - "*iex*"
      - "*irm*"
      - "*Start-Sleep -Seconds 24*"
      - "*-w h*"
  condition: selection_image and selection_commandline
falsepositives:
  - 管理者が同じ表現を含む検証scriptを実行した場合
level: high
tags:
  - attack.t1204.004
  - attack.t1059.001
  - attack.t1105
