title: Telegram dead-drop resolver経由のClickFix PowerShell (20260805-clickfix-hunter-efdbd9a6673f)
id: 3434a583-27cc-5c77-929b-87e96622e3e4
status: experimental
description: Telegram HTMLのdescriptionからhostを抽出し、/l.datを取得して実行するClickFix系列を検知する。
author: AI-security-analysis
date: '2026-08-05'
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  selection_all:
    CommandLine|contains|all:
    - _description
    - /l.dat
    - irm
  selection_execute:
    CommandLine|contains:
    - iex
    - Invoke-Expression
    - voke-E
    - ke-Ex
  condition: selection_image and selection_all and selection_execute
falsepositives:
- Telegram HTMLを同じ抽出式で処理する管理script
level: high
tags:
- attack.execution
- attack.t1059.001
- attack.t1105
