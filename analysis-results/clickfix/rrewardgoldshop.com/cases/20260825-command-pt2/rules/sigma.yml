title: ClickFix captured command pt2
id: 4a4ef582-8886-a214-c9cd-a10ee9f3e542
status: experimental
description: clickfix-command.txtで確認したPowerShell command lineの特徴を検知する。
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\powershell.exe'
  selection_commandline:
    CommandLine|contains|all:
      - "*System.Diagnostics.Process*"
      - "*::Start*"
      - "*Trim('n')*"
      - "*Replace('j','d')*"
  condition: selection_image and selection_commandline
falsepositives:
  - 管理者が同じ表現を含む検証scriptを実行した場合
level: high
tags:
  - attack.t1204.004
  - attack.t1059.001
  - attack.t1027
  - attack.t1105
