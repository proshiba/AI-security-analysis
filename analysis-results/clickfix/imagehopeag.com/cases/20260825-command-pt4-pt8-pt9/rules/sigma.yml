title: ClickFix captured command pt4, pt8, pt9
id: 4f590416-5a05-efee-247a-78a6575e7579
status: experimental
description: clickfix-command.txtで確認したPowerShell command lineの特徴を検知する。
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\powershell.exe'
  selection_commandline:
    CommandLine|contains|all:
      - "*System.Net.WebClient*"
      - "*DownloadString*"
      - "*imagehopeag.com/hex/traffic*"
      - "*iEX*"
  condition: selection_image and selection_commandline
falsepositives:
  - 管理者が同じ表現を含む検証scriptを実行した場合
level: high
tags:
  - attack.t1204.004
  - attack.t1059.001
  - attack.t1105
