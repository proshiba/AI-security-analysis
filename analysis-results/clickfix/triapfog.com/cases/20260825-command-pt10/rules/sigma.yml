title: ClickFix captured command pt10
id: 37087cb6-e22d-4714-31eb-65742e2a084c
status: experimental
description: clickfix-command.txtで確認したPowerShell command lineの特徴を検知する。
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\powershell.exe'
  selection_commandline:
    CommandLine|contains|all:
      - "*Confirm-SecuritySession*"
      - "*FromBase64String*"
      - "*SecurityProtocolType]::Tls12*"
      - "*irm*"
      - "*iex*"
  condition: selection_image and selection_commandline
falsepositives:
  - 管理者が同じ表現を含む検証scriptを実行した場合
level: high
tags:
  - attack.t1204.004
  - attack.t1059.001
  - attack.t1027
  - attack.t1140
  - attack.t1105
  - attack.t1036
