title: Rundll32によるPhantomGraphサービスmodule実行
id: 12c0baba-2fc4-4fe6-9706-1d60adcdebbc
status: experimental
description: 公開sandboxで確認されたSysExcSvc／SysReadSvc DLLのrundll32 entrypoint実行を検知する。
references:
  - https://securelist.ru/tr/head-mare-targets-trueconf-server-with-phantomcore/116557/
author: AI-security-analysis
date: 2026-08-10
tags:
  - attack.execution
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\rundll32.exe'
  selection_module:
    CommandLine|contains:
      - 'SysExcSvc.dll'
      - 'SysReadSvc.dll'
  selection_entrypoint:
    CommandLine|contains:
      - ',#1'
      - ',ServiceMain'
  condition: selection_image and selection_module and selection_entrypoint
falsepositives:
  - 同名DLLとentrypointを使う検証用サービス。実体path、hash、署名、service作成eventを相関する。
level: high
