# マルウェア解析ブラウザUIをGitHub Pagesへ公開するワークフロー。
# ui/ だけを軽量に配信し、data.js は解析成果物から毎回再生成する。
# 成果物ファイル本体は同梱せず、UIからのリンクはGitHub上の該当パスへ向く。
name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "analysis-results/**"
      - "analysis_history.yaml"
      - ".github/workflows/deploy-pages.yml"
      - "analysis-framework/common/refresh_case_inventory.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          # ui/generate_ui_data.py が case の追加日(added_at)を git 履歴から
          # 取るため。既定の浅いクローン(depth=1)では追加日が復元できず、
          # 公開されるUIから新着順が失われる。
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージを導入
        run: pip install pyyaml

      - name: UIデータ(data.js)を再生成
        env:
          MALDB_REPO_SLUG: ${{ github.repository }}
          MALDB_REPO_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 ui/generate_ui_data.py

      - name: ポータル連携用インデックス(ui/api/v1)を再生成
        run: python3 ui/build_portal_index.py

      - name: 配信ビルド情報(build-info.js)を生成
        env:
          MALDB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - > ui/build-info.js <<'PY'
          import datetime, json, os, subprocess

          def git(*args: str) -> str:
              return subprocess.run(["git", *args], capture_output=True, text=True, check=True).stdout.strip()

          sha = git("rev-parse", "HEAD")
          info = {
              "built_at_utc": datetime.datetime.now(datetime.timezone.utc)
              .replace(microsecond=0)
              .isoformat(),
              "commit": sha,
              "commit_at_utc": git("log", "-1", "--format=%cI", sha),
              "run_url": os.environ.get("MALDB_RUN_URL") or None,
          }
          print("window.MALDB_BUILD = " + json.dumps(info, ensure_ascii=False) + ";")
          PY

      - name: 配信ディレクトリを構成
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -r ui _site/ui
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./ui/">
          <title>マルウェア解析ブラウザ</title>
          </head>
          <body>
          <p><a href="./ui/">マルウェア解析ブラウザへ移動します…</a></p>
          </body>
          </html>
          HTML

      - name: Pages設定を取得
        uses: actions/configure-pages@v5

      - name: 成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    # デプロイが失敗しても前回の公開が残るため、失敗は無音になる。気づける
    # ようにIssueを立てる。
    needs: [build, deploy]
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      key: deploy-pages
      title: "[CI] UIのGitHub Pagesデプロイが失敗しています"
      body: |
        UIの公開ワークフローが失敗しました。**サイトには前回公開された内容が
        残り続けている**ため、最新の解析は反映されていません。

        UI上部にもデータ鮮度の警告が出ます(最終更新から3日以上経過した場合)。
